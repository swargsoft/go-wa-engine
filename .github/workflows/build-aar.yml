name: Build WA Engine AAR

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AAR in Docker
        run: |
          mkdir -p bindings/android/build
          docker build -f bindings/android/Dockerfile -t wa-engine-builder .
          docker run --name temp-builder wa-engine-builder sh -c "cd /workspace && gomobile bind -target=android -androidapi=21 -o bindings/android/build/waengine.aar ."
          docker cp temp-builder:/workspace/bindings/android/build/waengine.aar ./bindings/android/build/waengine.aar
          docker rm temp-builder

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: bindings/android/build/waengine.aar
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: WA Engine ${{ steps.version.outputs.VERSION }}
          body: |
            ## WA Engine Release ${{ steps.version.outputs.VERSION }}

            ### Changes
            - Platform identification: Shows as "Google Chrome (Ubuntu)"
            - Connection-aware polling
            - Multi-session support

            ### Download
            Download `waengine.aar` and use in your React Native app.

            ### Size
            ~46MB (4 architectures: arm, arm64, x86, x86_64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
