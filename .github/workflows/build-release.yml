name: Build and release all platforms

on:
  push:
    tags:
      - "v*.*.*"

# One job per platform - run in parallel.
# All artifacts collected by the final release job.
jobs:
  # ── Linux amd64 ──────────────────────────────────────────────────────────────
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install gcc
        run: sudo apt-get install -y gcc
      - name: Build
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o waengine-linux-amd64 ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: waengine-linux-amd64

  # ── Linux arm64 ──────────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install arm64 cross-compiler
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            go build -ldflags="-s -w" -o waengine-linux-arm64 ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: waengine-linux-arm64

  # Single job builds BOTH mac binaries on the ARM runner via cross-compilation.
  # Eliminates the flaky macos-13 Intel runner which has very limited availability.
  build-mac:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build mac-arm64
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w" -o waengine-mac-arm64 ./cmd/server
      - name: Build mac-amd64 (cross-compiled from ARM)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w" -o waengine-mac-amd64 ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: waengine-mac-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-amd64
          path: waengine-mac-amd64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          $env:CGO_ENABLED = "1"
          go build -ldflags="-s -w" -o waengine-windows-amd64.exe ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: waengine-windows-amd64.exe

  # ── Publish GitHub Release ────────────────────────────────────────────────────
  release:
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-mac
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: WA Engine ${{ steps.version.outputs.VERSION }}
          files: |
            dist/linux-amd64/waengine-linux-amd64
            dist/linux-arm64/waengine-linux-arm64
            dist/mac-arm64/waengine-mac-arm64
            dist/mac-amd64/waengine-mac-amd64
            dist/windows-amd64/waengine-windows-amd64.exe
          body: |
            ## WA Engine ${{ steps.version.outputs.VERSION }}

            ### Desktop / server (standalone binaries)
            Download the binary for your platform and run it. The PWA connects to `http://localhost:8080`.

            | Platform | File |
            |---|---|
            | Linux x64 | `waengine-linux-amd64` |
            | Linux arm64 (Raspberry Pi, etc.) | `waengine-linux-arm64` |
            | macOS Intel | `waengine-mac-amd64` |
            | Windows x64 | `waengine-windows-amd64.exe` |

            **Quick start (Mac/Linux):**
            ```bash
            chmod +x waengine-*
            ./waengine-mac-arm64 --port 8080 --data ~/wa-data
            ```

            **Quick start (Windows):**
            ```powershell
            .\waengine-windows-amd64.exe --port 8080 --data C:\wa-data
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
