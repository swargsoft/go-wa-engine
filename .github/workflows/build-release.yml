name: Build and release all platforms

on:
  push:
    tags:
      - "v*.*.*"

env:
  MODULE: github.com/swargsoft/wa-engine
  VERSION_LDFLAG: -X github.com/swargsoft/wa-engine/core.Version={{ version }}

permissions:
  contents: write

# One job per platform - run in parallel.
# Checksums + manifest generated by the release job at the end.
jobs:
  # ── Linux amd64 ──────────────────────────────────────────────────────────────
  build-linux-amd64:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install gcc
        run: sudo apt-get install -y gcc
      - name: Build
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o msgly-engine-linux-amd64 ./cmd/server
      - name: Generate checksum
        id: checksum
        run: |
          SHA=$(sha256sum msgly-engine-linux-amd64 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  msgly-engine-linux-amd64" > msgly-engine-linux-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          retention-days: 1
          path: |
            msgly-engine-linux-amd64
            msgly-engine-linux-amd64.sha256

  # ── Linux arm64 ──────────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install arm64 cross-compiler
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o msgly-engine-linux-arm64 ./cmd/server
      - name: Generate checksum
        id: checksum
        run: |
          SHA=$(sha256sum msgly-engine-linux-arm64 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  msgly-engine-linux-arm64" > msgly-engine-linux-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          retention-days: 1
          path: |
            msgly-engine-linux-arm64
            msgly-engine-linux-arm64.sha256

  # Single job builds BOTH mac binaries on the ARM runner via cross-compilation.
  build-mac:
    runs-on: macos-14
    timeout-minutes: 20
    outputs:
      sha256_arm64: ${{ steps.checksum-arm64.outputs.sha256 }}
      sha256_amd64: ${{ steps.checksum-amd64.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build mac-arm64
        id: build-arm64
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o msgly-engine-mac-arm64 ./cmd/server
      - name: Checksum mac-arm64
        id: checksum-arm64
        run: |
          SHA=$(shasum -a 256 msgly-engine-mac-arm64 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  msgly-engine-mac-arm64" > msgly-engine-mac-arm64.sha256
      - name: Build mac-amd64 (cross-compiled from ARM)
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w -X ${{ env.MODULE }}/core.Version=${VERSION}" \
            -o msgly-engine-mac-amd64 ./cmd/server
      - name: Checksum mac-amd64
        id: checksum-amd64
        run: |
          SHA=$(shasum -a 256 msgly-engine-mac-amd64 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA  msgly-engine-mac-amd64" > msgly-engine-mac-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          retention-days: 1
          path: |
            msgly-engine-mac-arm64
            msgly-engine-mac-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mac-amd64
          retention-days: 1
          path: |
            msgly-engine-mac-amd64
            msgly-engine-mac-amd64.sha256

  build-windows:
    runs-on: windows-latest
    outputs:
      sha256_amd64: ${{ steps.checksum-amd64.outputs.sha256 }}
      sha256_arm64: ${{ steps.checksum-arm64.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build amd64
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          $env:CGO_ENABLED = "1"
          go build -ldflags="-s -w -X $env:MODULE/core.Version=$version" `
            -o msgly-engine-windows-amd64.exe ./cmd/server
        env:
          MODULE: ${{ env.MODULE }}
      - name: Generate checksum amd64
        id: checksum-amd64
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 msgly-engine-windows-amd64.exe).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  msgly-engine-windows-amd64.exe" | Out-File -FilePath msgly-engine-windows-amd64.exe.sha256 -Encoding ascii
      - name: Install LLVM for arm64 cross-compilation
        run: choco install llvm --no-progress -y
      - name: Build arm64
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          $env:CC = "clang --target=aarch64-pc-windows-msvc"
          go build -ldflags="-s -w -X $env:MODULE/core.Version=$version" `
            -o msgly-engine-windows-arm64.exe ./cmd/server
        env:
          MODULE: ${{ env.MODULE }}
      - name: Generate checksum arm64
        id: checksum-arm64
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 msgly-engine-windows-arm64.exe).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  msgly-engine-windows-arm64.exe" | Out-File -FilePath msgly-engine-windows-arm64.exe.sha256 -Encoding ascii
      - name: Sign executables (requires CODESIGN_PFX_B64 secret)
        if: ${{ env.CODESIGN_PFX_B64 != '' }}
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $pfxPath = "$env:TEMP\swargsoft.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:CODESIGN_PFX_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          foreach ($exe in @("msgly-engine-windows-amd64.exe", "msgly-engine-windows-arm64.exe")) {
            & $signtool sign `
              /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $pfxPath /p $env:CODESIGN_PASSWORD `
              /d "Msgly Engine" /du "https://msgly.swargsoft.com" `
              $exe
            Write-Host "✓ Signed $exe"
          }
          Remove-Item $pfxPath -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          retention-days: 1
          path: |
            msgly-engine-windows-amd64.exe
            msgly-engine-windows-amd64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          retention-days: 1
          path: |
            msgly-engine-windows-arm64.exe
            msgly-engine-windows-arm64.exe.sha256

  # ── Generate aggregated checksums + version manifest ─────────────────────────
  checksums:
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-mac
      - build-windows
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate aggregated SHA256SUMS
        run: |
          find dist -name '*.sha256' -exec cat {} + | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Generate version manifest (latest.json)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG_URL="https://github.com/swargsoft/go-wa-engine/releases/download/${VERSION}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "release_url": "https://github.com/${{ github.repository }}/releases/tag/${VERSION}",
            "platforms": {
              "mac-arm64": {
                "filename": "msgly-engine-mac-arm64",
                "url": "${TAG_URL}/msgly-engine-mac-arm64",
                "sha256": "${{ needs.build-mac.outputs.sha256_arm64 }}"
              },
              "mac-amd64": {
                "filename": "msgly-engine-mac-amd64",
                "url": "${TAG_URL}/msgly-engine-mac-amd64",
                "sha256": "${{ needs.build-mac.outputs.sha256_amd64 }}"
              },
              "linux-amd64": {
                "filename": "msgly-engine-linux-amd64",
                "url": "${TAG_URL}/msgly-engine-linux-amd64",
                "sha256": "${{ needs.build-linux-amd64.outputs.sha256 }}"
              },
              "linux-arm64": {
                "filename": "msgly-engine-linux-arm64",
                "url": "${TAG_URL}/msgly-engine-linux-arm64",
                "sha256": "${{ needs.build-linux-arm64.outputs.sha256 }}"
              },
              "windows-amd64": {
                "filename": "msgly-engine-windows-amd64.exe",
                "url": "${TAG_URL}/msgly-engine-windows-amd64.exe",
                "sha256": "${{ needs.build-windows.outputs.sha256_amd64 }}"
              },
              "windows-arm64": {
                "filename": "msgly-engine-windows-arm64.exe",
                "url": "${TAG_URL}/msgly-engine-windows-arm64.exe",
                "sha256": "${{ needs.build-windows.outputs.sha256_arm64 }}"
              }
            }
          }
          EOF

      - name: Upload aggregated checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          retention-days: 1
          path: |
            SHA256SUMS
            latest.json

  # ── Publish GitHub Release ────────────────────────────────────────────────────
  release:
    needs:
      - checksums
      - build-linux-amd64
      - build-linux-arm64
      - build-mac
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: List release artifacts
        run: find dist -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Msgly Engine ${{ steps.version.outputs.VERSION }}
          files: |
            dist/linux-amd64/msgly-engine-linux-amd64
            dist/linux-amd64/msgly-engine-linux-amd64.sha256
            dist/linux-arm64/msgly-engine-linux-arm64
            dist/linux-arm64/msgly-engine-linux-arm64.sha256
            dist/mac-arm64/msgly-engine-mac-arm64
            dist/mac-arm64/msgly-engine-mac-arm64.sha256
            dist/mac-amd64/msgly-engine-mac-amd64
            dist/mac-amd64/msgly-engine-mac-amd64.sha256
            dist/windows-amd64/msgly-engine-windows-amd64.exe
            dist/windows-amd64/msgly-engine-windows-amd64.exe.sha256
            dist/windows-arm64/msgly-engine-windows-arm64.exe
            dist/windows-arm64/msgly-engine-windows-arm64.exe.sha256
            dist/checksums/SHA256SUMS
            dist/checksums/latest.json
          body: |
            ## Msgly Engine ${{ steps.version.outputs.VERSION }}

            ### Desktop / server (standalone binaries)

            Download the binary for your platform and verify its checksum.

            | Platform | File | SHA256 |
            |---|---|---|
            | macOS Apple Silicon | `msgly-engine-mac-arm64` | `${{ needs.build-mac.outputs.sha256_arm64 }}` |
            | macOS Intel | `msgly-engine-mac-amd64` | `${{ needs.build-mac.outputs.sha256_amd64 }}` |
            | Linux x64 | `msgly-engine-linux-amd64` | `${{ needs.build-linux-amd64.outputs.sha256 }}` |
            | Linux arm64 | `msgly-engine-linux-arm64` | `${{ needs.build-linux-arm64.outputs.sha256 }}` |
            | Windows x64 | `msgly-engine-windows-amd64.exe` | `${{ needs.build-windows.outputs.sha256_amd64 }}` |
            | Windows arm64 | `msgly-engine-windows-arm64.exe` | `${{ needs.build-windows.outputs.sha256_arm64 }}` |

            **Run once in foreground (Mac/Linux):**
            ```bash
            chmod +x msgly-engine-mac-arm64
            ./msgly-engine-mac-arm64 --port 8080
            ```

            **Install as background service — auto-starts on boot, survives sleep/wake (Mac/Linux):**
            ```bash
            chmod +x msgly-engine-mac-arm64
            sudo ./msgly-engine-mac-arm64 --install-service --port 8080
            # Uninstall: sudo ./msgly-engine-mac-arm64 --uninstall-service
            ```

            **Install as background service (Windows — run PowerShell as Administrator):**
            ```powershell
            .\msgly-engine-windows-amd64.exe --install-service --port 8080
            # Uninstall: .\msgly-engine-windows-amd64.exe --uninstall-service
            ```

            **Run once in foreground (Windows):**
            ```powershell
            .\msgly-engine-windows-amd64.exe --port 8080
            ```

            ### Verify Checksums

            ```bash
            curl -L -O "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/SHA256SUMS"
            sha256sum --check SHA256SUMS
            ```
                env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Delete this run's intermediate artifacts after release ─────────────────
  cleanup:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete this run's artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            let deleted = 0;
            for await (const page of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            )) {
              for (const a of page.data) {
                if (a.expired) continue;
                if (a.workflow_run?.id !== runId) continue;
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                core.info(`deleted artifact ${a.name} (${a.id})`);
                deleted++;
              }
            }
            core.info(`Deleted ${deleted} artifact(s) for run ${runId}`);
